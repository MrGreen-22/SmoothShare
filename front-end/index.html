<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmoothShare</title>
    <link rel="stylesheet" href="app/index.css">


    <script src="./vendor/peerjs.min.js"></script>
    <script defer src="app/index.js"></script>
    <script defer src="app/p2p_logic.js"></script>
</head>

<body>
    <div class="app-container">
        <main class="card">
            <header class="header">
                <h1 class="title" id="appTitle">Smooth Share</h1>
                <p class="subtitle" id="appSubtitle">Transfer files directly between browsers</p>
            </header>
            <div class="mode-selection"><button class="mode-btn" id="sendModeBtn" aria-label="Switch to send mode">
                    <div class="mode-icon">
                        📤
                    </div>
                    <div id="sendButtonText">
                        Send File
                    </div>
                </button> <button class="mode-btn" id="receiveModeBtn" aria-label="Switch to receive mode">
                    <div class="mode-icon">
                        📥
                    </div>
                    <div id="receiveButtonText">
                        Receive File
                    </div>
                </button>
            </div>
            <!-- Send Mode -->
            <div class="transfer-section" id="sendSection">
                <label class="connection-label" for="senderPeerIdDisplayMain">YourPeer ID</label>
                <div class="peer-id-container">
                    <div class="peer-id-display" id="senderPeerIdDisplayMain">
                        Initializing...
                    </div><button class="btn-icon btn-copy" disabled>📋 Copy</button>
                </div>
                <div class="file-input-wrapper"><label for="fileInput" class="file-input-label" id="fileInputLabel">
                        <div style="font-size: 48px; margin-bottom: 16px;">
                            📁
                        </div>
                        <div style="font-size: 16px; font-weight: 600; color: #2d3748;">
                            Click to select a file
                        </div>
                        <div class="file-info" id="fileInfo">
                            No file selected
                        </div>
                    </label> <input type="file" id="fileInput" class="file-input">
                </div>
                <div class="connection-section"><label for="receiverPeerIdInput" class="connection-label">Receiver's
                        Peer ID</label>
                    <div class="input-group"><input type="text" id="receiverPeerIdInput" class="peer-input"
                            placeholder="Enter receiver's peer ID"> <button class="btn btn-primary" id="connectSendBtn"
                            disabled>Connect &amp; Send</button>
                    </div>
                    <button class="btn-close" id="closeReceiveBtn" disabled>Close Connection</button>
                    <div class="message connection-message"></div>
                </div>
                <div class="status-section" id="sendStatus">
                    <div class="status-text" id="sendStatusText">
                        Connecting...
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="sendProgressBar"></div>
                    </div>
                    <div class="progress-text" id="sendProgressText">
                        0%
                    </div>
                </div>
                <div class="message transfer-message"></div>
            </div>
            <!-- Receive Mode -->
            <div class="transfer-section" id="receiveSection">
                <div class="connection-section">
                    <label for="receiverPeerIdDisplayMain" class="connection-label">
                        Your Peer ID (share this with sender)
                    </label>
                    <div class="peer-id-container">
                        <div class="peer-id-display" id="receiverPeerIdDisplayMain">
                            Initializing...
                        </div><button class="btn-icon btn-copy" disabled>📋 Copy</button>
                    </div>
                    <button class="btn-close" id="closeReceiveBtn" disabled>Close Connection</button>
                    <div class="message connection-message"></div>
                    <div class="status-text" style="text-align: center; color: #4a5568; margin-top: 24px;">
                        Waiting for connection...
                    </div>
                </div>
                <div class="status-section" id="receiveStatus">
                    <div class="status-text" id="receiveStatusText"></div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="receiveProgressBar"></div>
                    </div>
                    <div class="progress-text" id="receiveProgressText">
                        0%
                    </div>
                </div>
                <div class="message transfer-message"></div>
            </div>
        </main>
    </div>
    <div class="toast" id="toast"></div>

</body>

</html>
